<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="{{ .Site.Params.description }}" />
<title>{{ .Site.Title }} | AI Automation Agency</title>

<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          florima: {
            bg: "#fffefb",
            ink: "#09090B",
            muted: "#52525B",
            accent: "#eb5b19",
            soft: "#FFF1E5",
            highlight: "#FAA240",
            border: "#eceae3",
          },
        },
        boxShadow: {
          premium: "0 36px 96px rgba(9, 9, 11, 0.22)",
          card: "0 18px 46px rgba(9, 9, 11, 0.08)",
        },
        fontFamily: {
          sans: ["Inter", "ui-sans-serif", "system-ui", "Helvetica Neue", "Helvetica", "Arial", "sans-serif"],
          title: ["Space Grotesk", "Inter", "ui-sans-serif", "system-ui", "sans-serif"],
          subtitle: ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "monospace"],
        },
        maxWidth: {
          page: "1180px",
        },
      },
    },
  };
</script>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    font-family: "Inter", ui-sans-serif, system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif;
  }
</style>
