<section class="mx-auto w-[min(1180px,calc(100%_-_40px))] pb-24 pt-10" id="contact">
  {{ $d := .Site.Data.content.contact }}
  <!-- Dark card CTA -->
  <div class="relative isolate overflow-hidden rounded-2xl bg-[#32372c] px-6 py-20 text-center shadow-[0_40px_100px_rgba(0,0,0,0.28)]">


    <h2 class="mx-auto mb-5 max-w-[780px] text-[clamp(1.7rem,3.4vw,2.4rem)] font-medium leading-snug tracking-tight text-white">
      <span class="text-[#eb5b19]">{{ $d.title.prefix }}</span>{{ $d.title.middle }}<span class="text-[#eb5b19]">{{ $d.title.highlight }}</span>{{ $d.title.suffix }}
    </h2>
    <p class="mx-auto mb-10 max-w-[540px] text-sm leading-relaxed text-white/50">
      {{ $d.description }}
    </p>

    <!-- Pill CTA button -->
    <a href="{{ $d.cta.url }}" class="group inline-flex items-center gap-3 rounded-full bg-[#eb5b19] py-2 pl-2 pr-6 font-medium text-white shadow-[0_8px_32px_rgba(235,91,25,0.40)] transition hover:shadow-[0_12px_40px_rgba(235,91,25,0.55)] hover:-translate-y-0.5">
      <span class="grid h-9 w-9 place-items-center rounded-full bg-[#32372c] text-white transition group-hover:scale-95">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </span>
      {{ $d.cta.label }}
    </a>
  </div>
</section>
