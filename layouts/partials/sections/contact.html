<section class="mx-auto grid w-[min(1180px,calc(100%_-_40px))] items-start gap-[clamp(32px,6vw,78px)] pb-24 pt-10 lg:grid-cols-[0.9fr_1.1fr]" id="contact">
  <div>
    <p class="mb-4 text-xs font-black uppercase tracking-[0.13em] text-florima-purple">Get Started Now</p>
    <h2 class="mb-5 max-w-[820px] text-[clamp(2rem,11vw,3rem)] font-extrabold leading-none tracking-normal md:text-[clamp(2.25rem,4.2vw,4.7rem)]">Ready to streamline, scale, and support your team?</h2>
    <p class="text-florima-muted">
      Share what you want to automate and we will help you choose the right
      plan, workflow, or AI support system for your business.
    </p>
    <div class="mt-7 flex flex-wrap gap-4 font-extrabold text-florima-deep">
      <a class="hover:text-florima-purple" href="mailto:hello@florima.io">hello@florima.io</a>
      <a class="hover:text-florima-purple" href="https://www.linkedin.com" rel="noreferrer">LinkedIn</a>
    </div>
  </div>

  <form class="grid gap-4 rounded-lg border border-[#27272A1F] bg-white p-7 shadow-card" id="contact-form" action="/api/contact" method="post">
    <label class="grid gap-2 text-[0.92rem] font-extrabold text-[#09090B]">
      Name
      <input class="w-full rounded-lg border border-[#27272A1F] bg-[#FEFBF6] px-3.5 py-3 text-florima-ink outline-none focus:border-florima-purple/70 focus:shadow-[0_0_0_3px_rgba(243,128,32,0.18)]" type="text" name="name" autocomplete="name" required />
    </label>
    <label class="grid gap-2 text-[0.92rem] font-extrabold text-[#09090B]">
      Email
      <input class="w-full rounded-lg border border-[#27272A1F] bg-[#FEFBF6] px-3.5 py-3 text-florima-ink outline-none focus:border-florima-purple/70 focus:shadow-[0_0_0_3px_rgba(243,128,32,0.18)]" type="email" name="email" autocomplete="email" required />
    </label>
    <label class="grid gap-2 text-[0.92rem] font-extrabold text-[#09090B]">
      Message
      <textarea class="w-full resize-y rounded-lg border border-[#27272A1F] bg-[#FEFBF6] px-3.5 py-3 text-florima-ink outline-none focus:border-florima-purple/70 focus:shadow-[0_0_0_3px_rgba(243,128,32,0.18)]" name="message" rows="5" required></textarea>
    </label>
    <button class="inline-flex min-h-[50px] items-center justify-center rounded-lg border border-transparent bg-florima-purple px-5 py-3 font-extrabold text-white shadow-[0_18px_38px_rgba(243,128,32,0.24)] transition hover:-translate-y-0.5" type="submit">Get Started Now</button>
    <p class="min-h-6 text-florima-muted" id="form-status" role="status" aria-live="polite"></p>
  </form>
</section>
